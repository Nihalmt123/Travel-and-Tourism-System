{% extends 'travelapp/base.html' %}{% block content %}<div class="container"><div class="section-title"><div><h2>{{ cat.icon }} {{ cat.name }} Packages</h2><p class="small">{{ cat.description }}</p></div></div><div class="grid">{% for p in packages %}<div class="card"><div class="imgwrap"><img src="{{ p.image }}"><span class="badge">{{ p.days }} Days</span></div><div class="card-body"><h2>{{ p.name }}</h2><div class="meta"><span>{{ p.country }}</span><span>⭐ {{ p.rating }}</span></div><div class="price">₹{{ p.price }}</div><a class="btn" href="{% url 'package_details' p.id %}">View Details</a></div></div>{% endfor %}</div></div>{% endblock %}
