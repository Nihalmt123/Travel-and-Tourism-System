{% extends 'travelapp/base.html' %}{% block content %}<div class="form-box"><h2>Create Account</h2><form method="post">{% csrf_token %}<input name="username" placeholder="Username" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><input type="password" name="confirm_password" placeholder="Confirm Password" required><button class="btn green" style="width:100%">Register</button></form><p>Already have account? <a style="color:#115dfc" href="{% url 'login' %}">Login</a></p></div>{% endblock %}
