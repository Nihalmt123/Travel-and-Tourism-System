{% extends 'travelapp/base.html' %}{% block content %}<div class="container"><div class="section-title"><h2>Wishlist</h2></div><div class="grid">{% for item in items %}<div class="card"><div class="imgwrap"><img src="{{ item.package.image }}"><span class="badge">♥ Saved</span></div><div class="card-body"><h2>{{ item.package.name }}</h2><p>{{ item.package.country }}</p><div class="price">₹{{ item.package.price }}</div><a class="btn" href="{% url 'package_details' item.package.id %}">View Details</a></div></div>{% empty %}<div class="empty"><h2>Your wishlist is empty</h2></div>{% endfor %}</div></div>{% endblock %}
